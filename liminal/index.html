<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ハザマ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #050503;
    --text: #e8e0b8;
    --muted: #8f8766;
    --rec: #ff3b2f;
    --sleep: #b7a4e0;
    --sane: #e8d27a;
    --paper: #e4dcc4;
    --ink: #2a2418;
    --pixel: "DotGothic16", "Osaka-mono", "MS Gothic", ui-monospace, monospace;
    --s: 3;
    --u: max(1px, calc(var(--s) * 1px));
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--pixel);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .screen {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 960px; height: 540px;
    overflow: hidden;
  }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  #view { display: block; width: 100%; height: 100%; cursor: none; }
  .scan {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0, rgba(0,0,0,0) calc(var(--u) - 1px),
      rgba(0,0,0,.13) calc(var(--u) - 1px), rgba(0,0,0,.13) var(--u));
    mix-blend-mode: multiply;
  }
  .pain, .white { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .pain { background: radial-gradient(ellipse at center, rgba(120,0,0,0) 30%, rgba(150,10,10,.75) 100%); }
  .white { background: #fffbe8; transition: opacity 2.6s ease-in; }

  .hud {
    position: absolute; inset: 0; pointer-events: none;
    font-size: max(10px, calc(var(--s) * 6.5px));
    line-height: 1.3;
    color: var(--text);
    text-shadow: calc(var(--u) * .5) 0 rgba(255, 40, 60, .35), calc(var(--u) * -.5) 0 rgba(40, 200, 255, .3);
    letter-spacing: .06em;
    font-variant-numeric: tabular-nums;
  }
  .hud > div { position: absolute; }
  .tl { left: calc(var(--u) * 7); top: calc(var(--u) * 5); }
  .tr { right: calc(var(--u) * 7); top: calc(var(--u) * 5); display: grid; justify-items: end; gap: calc(var(--u) * 2); }
  .bl { left: calc(var(--u) * 7); bottom: calc(var(--u) * 5); display: grid; gap: calc(var(--u) * 2); }
  .br { right: calc(var(--u) * 7); bottom: calc(var(--u) * 5); }
  .tc { left: 0; right: 0; top: calc(var(--u) * 5); text-align: center; opacity: 0; transition: opacity .4s; }
  .rec i { font-style: normal; color: var(--rec); animation: blink 1.2s steps(1) infinite; }
  .dim { opacity: .7; }
  @keyframes blink { 50% { visibility: hidden; } }

  .anchors { display: flex; gap: calc(var(--u) * 2); }
  .anchors canvas { width: calc(var(--u) * 13); height: calc(var(--u) * 13); background: rgba(0,0,0,.35); outline: var(--u) solid rgba(232,224,184,.18); }
  .anchors canvas.got { outline-color: rgba(255,244,176,.7); background: rgba(40,30,0,.5); }
  .anchors-label { font-size: max(9px, calc(var(--s) * 5px)); opacity: .75; }

  .meter { display: flex; align-items: center; gap: calc(var(--u) * 3); }
  .meter span { width: 2.4em; }
  .meter b { display: block; width: calc(var(--u) * 56); height: calc(var(--u) * 4); background: rgba(0,0,0,.45); outline: var(--u) solid rgba(232,224,184,.25); }
  .meter i { display: block; height: 100%; width: 0; }
  #sleepBar { background: var(--sleep); }
  #sanBar { background: var(--sane); }
  .meter.warn b { animation: blink .5s steps(1) infinite; }
  .zone { opacity: .75; font-size: max(9px, calc(var(--s) * 5.5px)); }

  .inv { display: flex; gap: calc(var(--u) * 2); pointer-events: auto; }
  .inv button {
    font: inherit; font-size: max(9px, calc(var(--s) * 5px)); color: var(--text);
    display: grid; justify-items: center; gap: calc(var(--u) * 1);
    min-width: calc(var(--u) * 22);
    padding: calc(var(--u) * 2); margin: 0;
    background: rgba(0,0,0,.45); border: var(--u) solid rgba(232,224,184,.22);
    cursor: pointer; text-shadow: inherit;
  }
  .inv button:disabled { opacity: .35; cursor: default; }
  .inv button.on { border-color: #ffd080; }
  .inv button:focus-visible { outline: 2px solid var(--sane); }
  .inv canvas { width: calc(var(--u) * 14); height: calc(var(--u) * 14); }
  .inv kbd { font: inherit; opacity: .6; }
  .bat { width: calc(var(--u) * 14); height: calc(var(--u) * 2); background: rgba(255,255,255,.15); }
  .bat i { display: block; height: 100%; background: #ffd080; width: 0; }

  .msg {
    left: 8%; right: 8%; bottom: calc(var(--u) * 46);
    text-align: center; font-size: max(11px, calc(var(--s) * 7px));
    opacity: 0; transition: opacity 1.2s steps(6);
    white-space: pre-line;
  }
  .msg.on { opacity: .95; }
  .note {
    left: 50%; top: 46%; transform: translate(-50%, -50%) rotate(-1.2deg);
    width: min(78%, calc(var(--u) * 190));
    box-sizing: border-box;
    padding: calc(var(--u) * 8) calc(var(--u) * 10);
    background: var(--paper); color: var(--ink);
    text-shadow: none;
    box-shadow: calc(var(--u) * 3) calc(var(--u) * 3) 0 rgba(0,0,0,.5);

  }
  .note small { display: block; opacity: .6; font-size: .75em; margin-bottom: .4em; letter-spacing: .2em; }
  .note p { margin: 0; white-space: pre-line; }
  .note.mad p { color: #5a1410; letter-spacing: .2em; }

  .overlay {
    position: absolute; inset: 0;
    display: grid; place-content: center; justify-items: center;
    gap: calc(var(--u) * 4);
    padding: 16px; box-sizing: border-box;
    text-align: center;
    background: rgba(5, 5, 3, .8);
    cursor: pointer;
  }

    margin: 0; font-weight: 400;
    font-size: max(36px, calc(var(--s) * 22px)); letter-spacing: .3em; line-height: 1;
    text-shadow: calc(var(--u) * 1) 0 rgba(255,40,60,.45), calc(var(--u) * -1) 0 rgba(40,200,255,.4);
  }
  .overlay .sub { margin: 0; color: var(--muted); font-size: max(10px, calc(var(--s) * 6px)); letter-spacing: .4em; }
  .overlay .lore { margin: calc(var(--u) * 3) 0 0; max-width: 36em; font-size: max(11px, calc(var(--s) * 6.5px)); line-height: 1.8; }
  .overlay .lore em { font-style: normal; color: #ffd080; }
  .overlay .go { margin: calc(var(--u) * 4) 0 0; font-size: max(13px, calc(var(--s) * 8px)); animation: blink 1.4s steps(1) infinite; }
  .overlay .keys { margin: 0; color: var(--muted); font-size: max(10px, calc(var(--s) * 5.5px)); line-height: 1.8; }
  .overlay .stats { display: flex; flex-wrap: wrap; justify-content: center; gap: .6em 2em; font-size: max(11px, calc(var(--s) * 6.5px)); }
  .overlay .stats span { display: grid; }
  .overlay .stats small { color: var(--muted); font-size: .8em; }
  .overlay.end-assim { background: rgba(20, 14, 30, .88); }
  .overlay.end-wake { background: rgba(255, 251, 232, .92); color: #2a2418; }
  .overlay.end-wake h1 { text-shadow: none; }
  .overlay.end-wake .sub, .overlay.end-wake .stats small { color: #7a6a48; }
</style>
</head>
<body>
<div class="screen" id="screen">
  <canvas id="view" width="320" height="180" aria-label="リミナルスペース"></canvas>
  <div class="scan"></div>
  <div class="pain" id="pain"></div>
  <div class="hud" id="hud" hidden>
    <div class="tl"><div class="rec"><i>●</i> REC</div><div class="dim" id="clock">AM 3:14:00</div></div>
    <div class="tr"><div class="anchors" id="anchors"></div><div class="anchors-label" id="anchorsLabel">異物 0 / 7</div></div>
    <div class="tc" id="sense">気配</div>
    <div class="bl">
      <div class="meter" id="sleepM"><span>眠気</span><b><i id="sleepBar"></i></b></div>
      <div class="meter" id="sanM"><span>正気</span><b><i id="sanBar"></i></b></div>
      <div class="zone"><span id="zone">B0 白い部屋</span>　<span id="dist">0</span>m</div>
    </div>
    <div class="br inv" id="inv"></div>
    <div class="msg" id="msg"></div>
    <div class="note" id="note" hidden><small id="noteNo">メモ</small><p id="noteText"></p></div>
  </div>
  <div class="white" id="white"></div>
  <div class="overlay" id="overlay">
    <h1 id="ovTitle">ハザマ</h1>
    <p class="sub" id="ovSub">LIMINAL SPACE</p>
    <p class="lore" id="ovLore">眠りと目覚めのあいだに、ハザマがある。<br>ここでは何も食べなくていい。ただ、ひどく眠い。<br>眠りきったとき、あなたはこの部屋の一部になる。<br>現実から紛れこんだ<em>色のある異物</em>を七つ集めて、目を覚ませ。</p>
    <p class="go" id="go">クリックして入る</p>
    <p class="keys" id="keys">体は勝手に前へ歩く。マウスで向きを変えるだけ<br>左クリック：物資を使う　右クリック：つねる　ホイール：ライト<br>メモは左クリックで閉じる<br>ヘッドホン推奨</p>
  </div>
</div>
<script>
"use strict";
// ============================================================
//  ハザマ — ドット絵のリミナルスペース
//  320x180 のレイキャスター。眠気に呑まれる前に、異物を七つ集めて目を覚ます
// ============================================================

const W = 320, H = 180;
const PL = 0.72;
const PROJ = (W / 2) / PL;
const T = 32;
const P = 6;
const R = 26;
const G = R * 2 + 1, G1 = G + 1;
const MAXD = 20;
const SEED = (() => { const m = /seed=(\d+)/.exec(location.search); return m ? +m[1] : 1998; })();

const cvs = document.getElementById("view");
const ctx = cvs.getContext("2d");
const img = ctx.createImageData(W, H);
const buf = new Uint32Array(img.data.buffer);
// 1フレームぶんの「明るさ」「素材ランプ」「発光量」。最後にまとめて色へ量子化する
const sB = new Float32Array(W * H), rB = new Uint8Array(W * H), eB = new Float32Array(W * H);

// ---------- 乱数 ----------
function hash2(x, y, s) {
  let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul((s + SEED * 131) | 0, 0x9e3779b9);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const mod = (a, n) => ((a % n) + n) % n;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// ---------- パレット ----------
function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
function ramp(stops) {
  const a = stops.map(hex), out = [];
  for (let i = 0; i < 16; i++) {
    const t = i / 15 * (a.length - 1), k = Math.min(a.length - 2, Math.floor(t)), f = t - k;
    out.push([0, 1, 2].map(j => Math.round(a[k][j] + (a[k + 1][j] - a[k][j]) * f)));
  }
  return out;
}
const RP = {
  WALL: 0, CARPET: 1, CEIL: 2, LIGHT: 3, BASE: 4, CONC: 5, CONCF: 6, CAUTION: 7,
  POOLW: 8, POOLF: 9, EXIT: 10, DOOR: 11, FIG: 12, PLASTIC: 13, ORANGE: 14,
  RED: 15, BLUE: 16, GOLD: 17, PINK: 18, GREEN: 19, PAPER: 20, WARM: 21, SCRAWL: 22,
};
const RAMP_SRC = [
  ["#07090b", "#353b41", "#7a828a", "#c3cad0", "#eef2f4"],   // 化粧パネルの壁（青白い灰）
  ["#060708", "#26292d", "#50565c", "#8d949a", "#bfc5ca"],   // 塩ビの床タイル
  ["#08090b", "#3e4349", "#868c93", "#ccd2d7", "#f6f9fb"],   // 天井材
  ["#101316", "#6a737b", "#bcc5cc", "#e8f1f6", "#ffffff"],   // 蛍光灯（昼光色）
  ["#040506", "#17191c", "#2d3135", "#4b5055", "#6c7277"],   // 幅木
  ["#080909", "#2b302f", "#4b5250", "#8d9591", "#c3c9c3"],
  ["#070808", "#232725", "#3a3f3d", "#6f7672", "#9aa29c"],
  ["#110d00", "#4d3c00", "#8a6d00", "#e0b400", "#ffe45c"],
  ["#060c0d", "#2d4244", "#5e7c80", "#b9d3d3", "#f2ffff"],
  ["#020b0e", "#0c3a42", "#1f6e7a", "#5cc1c9", "#b8f4f2"],
  ["#000a05", "#063a1c", "#0d6b33", "#2ee07a", "#d8ffe6"],
  ["#0b0703", "#2f1f0f", "#5a3c1e", "#8f6534", "#b88a52"],
  ["#000000", "#050505", "#0c0c0c", "#161616", "#262626"],
  ["#050506", "#18181c", "#303036", "#5a5a64", "#8a8a96"],
  ["#100500", "#4a1a00", "#a33c06", "#f06a14", "#ffb070"],
  // ↓ 現実の色（異物だけが持つ。眠くなっても褪せない）
  ["#1a0205", "#6b0a14", "#c41e2c", "#ff5a5a", "#ffd0c8"],
  ["#020616", "#0c2a6b", "#2a64d8", "#6fb0ff", "#d8f0ff"],
  ["#140c00", "#5a3a00", "#b08010", "#f0cc40", "#fff4b0"],
  ["#1a0610", "#6b1840", "#d84c8c", "#ff9cc8", "#ffe4f0"],
  ["#021006", "#0a4a1e", "#20a048", "#70e890", "#e0ffe8"],
  ["#0f0e0a", "#4a463a", "#9a9480", "#e4dcc4", "#fffaf0"],
  ["#1a0c02", "#7a3a08", "#e89030", "#ffd080", "#fffbe8"],
  ["#0a0203", "#220606", "#3e0d0c", "#5c1a14", "#7a2a20"],
];
const NR = RAMP_SRC.length;
const EMIS = new Uint8Array(NR); EMIS[RP.LIGHT] = EMIS[RP.EXIT] = EMIS[RP.WARM] = 1;
const REAL = new Uint8Array(NR); [RP.RED, RP.BLUE, RP.GOLD, RP.PINK, RP.GREEN, RP.WARM].forEach(i => REAL[i] = 1);
// 眠気で世界が「夢の色」（くすんだ藤色）へ褪せていく。8段階ぶんの色表を先に作る
const DL = 8;
const COLS = new Uint32Array(DL * NR * 16);
for (let lv = 0; lv < DL; lv++) {
  const t = Math.pow(lv / (DL - 1), 0.9);
  for (let r = 0; r < NR; r++) {
    const rp = ramp(RAMP_SRC[r]);
    for (let i = 0; i < 16; i++) {
      const [cr, cg, cb] = rp[i];
      const lum = 0.3 * cr + 0.59 * cg + 0.11 * cb;
      const dr = 14 + lum * 0.74, dg = 10 + lum * 0.66, db = 24 + lum * 0.84;
      const m = (a, b) => Math.round(a + (b - a) * t);
      COLS[(lv * NR + r) * 16 + i] = (255 << 24) | (m(cb, db) << 16) | (m(cg, dg) << 8) | m(cr, dr);
    }
  }
}
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => v / 16);
const PURE_BLACK = 0xff000000;

// ---------- テクスチャ ----------
function mkTex(fn) {
  const b = new Float32Array(T * T), r = new Uint8Array(T * T);
  for (let y = 0; y < T; y++) for (let x = 0; x < T; x++) {
    const o = fn(x, y); r[y * T + x] = o[0]; b[y * T + x] = o[1];
  }
  return { b, r };
}
const n = (x, y, s) => hash2(x, y, s + 9000) - 0.5;

function wallOffice(x, y, stain) {
  if (y >= 28) return [RP.BASE, y === 28 ? 0.85 : 0.6 + n(x, y, 1) * 0.08];
  if (y === 0) return [RP.WALL, 0.5];
  // 継ぎ目だけがある、何も描かれていない化粧パネル
  let b = 0.7 + n(x, y, 2) * 0.025;
  const sx = x % 16;
  if (sx === 0) b = 0.46;
  else if (sx === 1) b += 0.07;
  if (y === 1) b += 0.05;
  if ((sx === 3 || sx === 13) && (y === 4 || y === 24)) b = 0.5;   // ビス
  b *= 0.93 + 0.07 * (y / 28);
  if (stain) {
    const L = 3 + Math.floor((n(x >> 1, 0, 9) + 0.5) * 14);
    if (y < L && sx > 1) b *= 0.84 + 0.14 * (y / L);
    if (y > 22) b *= 0.9 + 0.08 * (n(x >> 1, y >> 2, 10) + 0.5);
  }
  return [RP.WALL, b];
}
function wallConcrete(x, y) {
  if (y >= 26) return ((x + y) >> 2) & 1 ? [RP.CAUTION, 0.8] : [RP.PLASTIC, 0.15];
  if (y === 25) return [RP.CONC, 0.4];
  let b = 0.56 + n(x, y, 3) * 0.09 + n(x >> 3, y >> 3, 4) * 0.06;
  if (y % 13 === 0) b -= 0.12;
  return [RP.CONC, b];
}
function wallPool(x, y) {
  const gx = x % 8, gy = y % 8;
  if (gx === 0 || gy === 0) return [RP.POOLW, 0.55];
  if (y >= 24) return [RP.POOLF, 0.75 + n(x >> 3, y >> 3, 5) * 0.08];
  return [RP.POOLW, 0.84 + n(x >> 3, y >> 3, 6) * 0.06 + (gx === 1 || gy === 1 ? 0.05 : 0)];
}
const FONT = {
  E: ["###", "#..", "##.", "#..", "###"], X: ["#.#", "#.#", ".#.", "#.#", "#.#"],
  I: ["###", ".#.", ".#.", ".#.", "###"], T: ["###", ".#.", ".#.", ".#.", ".#."],
};
function withExit(base) {
  return (x, y) => {
    if (x >= 6 && x <= 25 && y >= 5 && y <= 13) {
      if (x === 6 || x === 25 || y === 5 || y === 13) return [RP.EXIT, 0.35];
      const lx = x - 9, ly = y - 7;
      if (ly >= 0 && ly < 5 && lx >= 0 && lx < 15 && lx % 4 < 3) {
        if (FONT["EXIT"[lx >> 2]][ly][lx % 4] === "#") return [RP.EXIT, 1.05];
      }
      return [RP.EXIT, 0.6];
    }
    return base(x, y);
  };
}
function withDoor(base) {
  return (x, y) => {
    if (x >= 9 && x <= 22 && y >= 5 && y <= 27) {
      if (y === 27) return [RP.DOOR, 0.02];
      if (x === 9 || x === 22 || y === 5) return [RP.DOOR, 0.38];
      if (x === 19 && (y === 16 || y === 17)) return [RP.CAUTION, 0.75];
      return [RP.DOOR, 0.6 + n(x, y >> 2, 7) * 0.05 + (x === 10 ? 0.1 : 0)];
    }
    return base(x, y);
  };
}
const WO = (x, y) => wallOffice(x, y, false);
const WOS = (x, y) => wallOffice(x, y, true);
const WALL_TEX = [];
{
  const office = [mkTex(WO), mkTex(WOS), mkTex(withExit(WO)), mkTex(withDoor(WOS))];
  const conc = mkTex(wallConcrete), concExit = mkTex(withExit(wallConcrete));
  const pool = mkTex(wallPool), poolExit = mkTex(withExit(wallPool));
  WALL_TEX.push(...office, conc, conc, concExit, conc, pool, pool, poolExit, pool, ...office);
}
// 塩ビの床タイル。濡れた床は、にじんだ水たまりになる
const carpet = (damp) => (x, y) => {
  const gx = x % 16, gy = y % 16;
  if (gx === 0 || gy === 0) return [RP.CARPET, 0.42];
  let b = 0.6 + (((x >> 4) + (y >> 4)) & 1 ? 0.03 : 0) + (hash2(x, y, 11) < 0.05 ? -0.06 : 0) + n(x, y, 12) * 0.02;
  if (damp) {
    const d = Math.hypot(x - 16 + n(y >> 2, 0, 13) * 7, (y - 16) * 1.3 + n(x >> 2, 0, 14) * 7);
    if (d < 10) b = 0.38 + (d < 7 && (x + y) % 5 === 0 ? 0.35 : 0);
  }
  return [RP.CARPET, b];
};
const concFloor = (line) => (x, y) => {
  if (line && x < 2 && n(x, y, 14) > -0.35) return [RP.CAUTION, 0.62 + n(x, y, 15) * 0.1];
  let b = 0.52 + n(x, y, 16) * 0.09 + n(x >> 2, y >> 2, 17) * 0.06;
  const oil = Math.hypot(x - 20, y - 11);
  if (!line && oil < 5) b *= 0.7 + oil * 0.05;
  return [RP.CONCF, b];
};
const poolFloor = (x, y) => {
  const gx = x % 8, gy = y % 8;
  if (gx === 0 || gy === 0) return [RP.POOLF, 0.45];
  return [RP.POOLF, 0.7 + n(x >> 3, y >> 3, 18) * 0.08];
};
const FLOOR_TEX = [
  mkTex(carpet(false)), mkTex(carpet(true)),
  mkTex(concFloor(false)), mkTex(concFloor(true)),
  mkTex(poolFloor), mkTex(poolFloor),
  mkTex(carpet(false)), mkTex(carpet(true)),

function render(tt) {

    const k = y * spr.w + x;
    if (!spr.a[k]) continue;
    const idx = clamp(Math.round(spr.b[k] * 14), 0, 15);
    u[(y + oy2) * s + x + ox2] = gray ? COLS[(RP.PLASTIC) * 16 + clamp(idx - 5, 1, 15)] : COLS[spr.r[k] * 16 + idx];
  }
  g.putImageData(im, 0, 0);
}
function refreshAnchors() {
  const box = $("anchors");
  if (!box.children.length) ANCHORS.forEach(a => { const c = document.createElement("canvas"); c.title = a.name; box.appendChild(c); });
  ANCHORS.forEach((a, i) => {
    const c = box.children[i], got = gs.anchors.has(a.id);
    drawIcon(c, a.spr, !got); c.classList.toggle("got", got);
  });
  $("anchorsLabel").textContent = `異物 ${gs.anchors.size} / 7`;
}
const INV = [
  { kind: "coffee", key: "1", spr: SPR.coffee },
  { kind: "gum", key: "2", spr: SPR.gum },
  { kind: "drops", key: "3", spr: SPR.drops },
  { kind: "flash", key: "F", spr: SPR.flash },
  { kind: "pinch", key: "Q" },
];
function buildInv() {
  const box = $("inv");
  INV.forEach(s => {
    const b = document.createElement("button");
    b.type = "button"; b.id = "inv-" + s.kind;
    if (s.spr) { const c = document.createElement("canvas"); drawIcon(c, s.spr, false); b.appendChild(c); }
    else { const e = document.createElement("span"); e.textContent = "つねる"; e.style.height = "calc(var(--u) * 14)"; e.style.display = "grid"; e.style.placeItems = "center"; b.appendChild(e); }
    const lab = document.createElement("span"); lab.className = "cnt"; b.appendChild(lab);
    if (s.kind === "flash") { const bat = document.createElement("span"); bat.className = "bat"; bat.innerHTML = "<i></i>"; b.appendChild(bat); }
    b.addEventListener("click", (e) => { e.stopPropagation(); s.kind === "pinch" ? pinch() : useItem(s.kind); });
    box.appendChild(b);
  });
  refreshInv();
}
const FINE = matchMedia("(pointer: fine)").matches;
function refreshInv() {
  INV.forEach(s => {
    const b = $("inv-" + s.kind), lab = b.querySelector(".cnt");
    if (s.kind === "pinch") { lab.innerHTML = `<kbd>${FINE ? "右クリック" : "タップ"}</kbd>`; return; }
    if (s.kind === "flash") {
      b.disabled = !gs.hasFlash; b.classList.toggle("on", gs.flashOn);
      lab.innerHTML = `<kbd>${FINE ? "ホイール" : "タップ"}</kbd> 電池${gs.inv.battery}`;
      b.querySelector(".bat i").style.width = clamp(gs.bat / 90 * 100, 0, 100) + "%";
      return;
    }
    b.disabled = gs.inv[s.kind] === 0;
    lab.innerHTML = `×${gs.inv[s.kind]}`;
  });
}
const GLITCH_CH = "ねむいおきろここどこだれまだ";
let hudT = 0;
function updateHud(dt) {
  hudT -= dt; if (hudT > 0) return; hudT = 0.2;
  const s = 3 * 3600 + 14 * 60 + Math.floor(st.t);
  const hh = Math.floor(s / 3600) % 12 || 12, mm = Math.floor(s / 60) % 60, ss = s % 60;
  $("clock").textContent = `AM ${hh}:${String(mm).padStart(2, "0")}:${String(ss).padStart(2, "0")}`;
  $("dist").textContent = Math.floor(st.dist * 1.5);
  let zn = ZONE_NAME[zoneHere()];
  if (gs.sanity < 50 && Math.random() < (50 - gs.sanity) / 80) zn = zn.split("").map(c => Math.random() < 0.4 ? GLITCH_CH[(Math.random() * GLITCH_CH.length) | 0] : c).join("");
  $("zone").textContent = zn;
  $("sleepBar").style.width = gs.sleep.toFixed(1) + "%";
  $("sanBar").style.width = gs.sanity.toFixed(1) + "%";
  $("sleepM").classList.toggle("warn", gs.sleep > 80);
  $("sanM").classList.toggle("warn", gs.sanity < 25);
  if (gs.flashOn) $("inv-flash").querySelector(".bat i").style.width = clamp(gs.bat / 90 * 100, 0, 100) + "%";
  $("inv-pinch").disabled = gs.pinchCD > 0;
  $("hud").style.filter = gs.sleep > 70 ? `blur(${((gs.sleep - 70) / 30 * 1.2).toFixed(2)}px)` : "";
}

// ---------- ループ ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (st.running || gs.over) {
    update(dt); updateHud(dt);
    pl.pitchDraw = pl.pitch + (pl.pitchOff || 0);
  } else if (!st.started) {
    st.t += dt * 0.25; pl.a += dt * 0.05; refreshGrid(pl.x, pl.y); updateLamps(st.t); updateDust(dt * 0.25); st.fade = 0.55;
  }
  const p0 = pl.pitch; pl.pitch = pl.pitchDraw ?? pl.pitch;
  render(st.t);
  pl.pitch = p0;
  requestAnimationFrame(frame);
}

function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = k >= 1 ? Math.floor(k) : k;
  const sc = $("screen");
  sc.style.width = W * s + "px"; sc.style.height = H * s + "px";
  sc.style.setProperty("--s", Math.max(1, s));
}
addEventListener("resize", fit); fit();

let lockedOnce = false;
const hasLock = "requestPointerLock" in cvs && matchMedia("(pointer: fine)").matches;
function start() {
  if (gs.over) { location.reload(); return; }
  initAudio();
  if (!st.started) {
    st.started = true; st.t = 0; st.fade = 0; st.glitch = 1.2;
    pl.a = 0.35; pl.pitch = 0;
    setTimeout(() => burst({ freq: 200, vol: 0.9, dur: 0.35 }), 900);
  }
  $("hud").hidden = false;
  if (!hasLock) { resume(); return; }
  try {
    const r = cvs.requestPointerLock();
    if (r && r.catch) r.catch(() => resume());
  } catch (e) { resume(); }
  setTimeout(() => { if (!st.running && document.pointerLockElement !== cvs) resume(); }, 400);
}
function resume() { st.running = true; $("overlay").hidden = true; last = performance.now(); if (au.ac) au.ac.resume(); }
function pause() {
  if (gs.over) return;
  st.running = false; keys.clear();
  $("ovLore").hidden = true;
  $("overlay").hidden = false;
  $("go").textContent = "クリックして戻る";
  if (au.ac) au.ac.suspend();
}
$("overlay").addEventListener("click", start);
document.addEventListener("pointerlockchange", () => {
  if (document.pointerLockElement === cvs) resume(); else if (st.running && lockedOnce) pause();
  if (document.pointerLockElement === cvs) lockedOnce = true;
});
cvs.addEventListener("click", () => { if (st.started && !st.running && !gs.over) start(); });
const steer = { on: false, x: 0 };
addEventListener("mousemove", (e) => {
  if (!st.running || gs.over) return;
  if (document.pointerLockElement !== cvs) {
    const r = cvs.getBoundingClientRect();
    steer.on = true;
    steer.x = clamp((e.clientX - (r.left + r.width / 2)) / (r.width / 2), -1, 1);
    return;
  }
  steer.on = false;
  pl.a += e.movementX * 0.0024;
  pl.pitch = clamp(pl.pitch - e.movementY * 0.25, -48, 48);
});
// マウスだけで遊べるように：左クリック＝そのとき一番いい物資を使う、右クリック＝つねる、ホイール＝ライト
function useBest() {
  const iv = gs.inv;
  if (gs.sleep >= 35 && iv.coffee) useItem("coffee");
  else if (iv.gum) useItem("gum");
  else if (iv.coffee) useItem("coffee");
  else if (iv.drops) useItem("drops");
  else say("使えるものを、何も持っていない。", null, 2000);
}
cvs.addEventListener("mousedown", (e) => {
  if (!st.running || gs.over) return;
  if (e.button === 0) { if (!$("note").hidden) $("note").hidden = true; else useBest(); }
  if (e.button === 2) pinch();
});
cvs.addEventListener("contextmenu", (e) => e.preventDefault());
let wheelT = 0;
addEventListener("wheel", (e) => {
  if (!st.running || gs.over) return;
  const now = performance.now();
  if (now - wheelT > 400) { wheelT = now; useItem("flash"); }
}, { passive: true });
addEventListener("keydown", (e) => {
  if (!st.running) return;
  keys.add(e.code);
  if (e.code === "Digit1") useItem("coffee");
  if (e.code === "Digit2") useItem("gum");
  if (e.code === "Digit3") useItem("drops");
  if (e.code === "KeyF") useItem("flash");
  if (e.code === "KeyQ") pinch();
  if (e.code === "KeyE") $("note").hidden = true;
  if (e.code.startsWith("Arrow") || e.code === "Space") e.preventDefault();
});
addEventListener("keyup", (e) => keys.delete(e.code));
addEventListener("blur", () => { if (st.running && !hasLock) pause(); keys.clear(); });
cvs.addEventListener("touchstart", (e) => {
  if (!st.running) return;
  const t = e.changedTouches[0];
  Object.assign(touch, { id: t.identifier, x: t.clientX, y: t.clientY, walk: true });
  $("note").hidden = true;
  e.preventDefault();
}, { passive: false });
cvs.addEventListener("touchmove", (e) => {
  for (const t of e.changedTouches) if (t.identifier === touch.id) {
    pl.a += (t.clientX - touch.x) * 0.006;
    pl.pitch = clamp(pl.pitch - (t.clientY - touch.y) * 0.3, -40, 40);
    touch.x = t.clientX; touch.y = t.clientY;
  }
  e.preventDefault();
}, { passive: false });
cvs.addEventListener("touchend", (e) => {
  for (const t of e.changedTouches) if (t.identifier === touch.id) { touch.walk = false; touch.id = null; }
});
if (!matchMedia("(pointer: fine)").matches) $("keys").innerHTML = "体は勝手に前へ歩く。なぞって向きを変えるだけ<br>右下のボタンで物資を使う・つねる<br>ヘッドホン推奨";

buildInv();
refreshAnchors();
refreshGrid(pl.x, pl.y);
requestAnimationFrame(frame);
</script>
</body>
</html>
